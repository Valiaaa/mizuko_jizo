    <section id="door-section" class="door-section" aria-hidden="true">
        <div class="door-hall" aria-label="三扇门">
            <div class="door-row">
                <button
                    class="door-card door-card--1"
                    type="button"
                    data-door="1"
                    data-motion="assets/Page5_门_asset/motion/door1.webp"
                    aria-label="进入第一扇门"
                >
                    <span class="door-card__void" aria-hidden="true"></span>
                    <img class="door-card__still" src="assets/Page5_门_asset/still/door1.png" alt="第一扇门" draggable="false">
                    <img class="door-card__motion" alt="" draggable="false">
                    <span class="door-card__visited" aria-hidden="true">已进入</span>
                </button>

                <button
                    class="door-card door-card--2"
                    type="button"
                    data-door="2"
                    data-motion="assets/Page5_门_asset/motion/door2.webp"
                    aria-label="进入第二扇门"
                >
                    <span class="door-card__void" aria-hidden="true"></span>
                    <img class="door-card__still" src="assets/Page5_门_asset/still/door2.png" alt="第二扇门" draggable="false">
                    <img class="door-card__motion" alt="" draggable="false">
                    <span class="door-card__visited" aria-hidden="true">已进入</span>
                </button>

                <div class="door-third-stack">
                    <button
                        class="door-card door-card--3"
                        type="button"
                        data-door="3"
                        data-motion="assets/Page5_门_asset/motion/door3.webp"
                        aria-label="进入第三扇门"
                    >
                        <span class="door-card__void" aria-hidden="true"></span>
                        <img class="door-card__still" src="assets/Page5_门_asset/still/door3.png" alt="第三扇门" draggable="false">
                        <img class="door-card__motion" alt="" draggable="false">
                        <span class="door-card__visited" aria-hidden="true">已进入</span>
                    </button>

                    <button
                        class="door-reflection"
                        type="button"
                        data-door="4"
                        aria-label="进入倒影中的第四扇门"
                    >
                        <img src="assets/Page5_门_asset/door-4-reflection.gif" alt="第四扇门的倒影" draggable="false">
                    </button>
                </div>
            </div>
        </div>

        <section id="door-room-1" class="door-room" data-room="1" aria-hidden="true">
            <div class="door-room__placeholder">
                <span>ROOM 01</span>
                <h2>第一扇门</h2>
                <p>独立场景内容待接入</p>
                <button type="button" data-return-doors>完成探索，返回三扇门</button>
            </div>
        </section>

        <section id="door-room-2" class="door-room" data-room="2" aria-hidden="true">
            <div class="door-room__placeholder">
                <span>ROOM 02</span>
                <h2>第二扇门</h2>
                <p>独立场景内容待接入</p>
                <button type="button" data-return-doors>完成探索，返回三扇门</button>
            </div>
        </section>

        <section id="door-room-3" class="door-room" data-room="3" aria-hidden="true">
            <div class="door-room__placeholder">
                <span>ROOM 03</span>
                <h2>第三扇门</h2>
                <p>独立场景内容待接入</p>
                <button type="button" data-return-doors>完成探索，返回三扇门</button>
            </div>
        </section>

        <section id="door-room-4" class="door-room door-room--reflection" data-room="4" aria-hidden="true">
            <div class="door-room__placeholder">
                <span>ROOM 04</span>
                <h2>倒影之门</h2>
                <p>第四扇门的场景内容待接入</p>
                <button type="button" data-return-doors>返回三扇门</button>
            </div>
        </section>
    </section>
